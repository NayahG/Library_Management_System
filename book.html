<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Books</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Paytone+One&family=Poppins:wght@100;200;300;400;500;600;700;800;900&family=Quicksand:wght@300..700&family=Sigmar&display=swap" rel="stylesheet">
</head>
<body class="bg-[#FFF8E8] flex flex-col min-h-screen">
    <nav class="bg-[#AAB396] text-white py-4 shadow-lg fixed top-0 w-full z-50">
        <div class="container mx-auto flex justify-between items-center px-6">
            <div class="flex items-center">
                <img src="img/booktrack.png" alt="Logo" class="h-10 w-auto"> 
                <span class="text-2xl font-[Sigmar] text-[#674636] ml-0">BookTrack</span>
            </div>
            <ul class="flex space-x-6 items-center">
                <li><a href="home.html" class="font-[Poppins] text-xl hover:text-[#674636]">Home</a></li>
                <li><a href="book.html" class="font-[Poppins] text-xl text-[#FFFFFF] border-b-2 border-[#FFFFFF]">Books</a></li>
                <li><a href="manage.html" class="font-[Poppins] text-xl hover:text-[#674636]">Manage</a></li>
                <li><a href="contact.html" class="font-[Poppins] text-xl hover:text-[#674636]">Contact</a></li>
                <li>
                    <a href="index.html">
                        <button onclick="logout()" class=" text-2xl hover:text-[#A31D1D] transition">
                            <i class="fas fa-sign-out-alt"></i>
                        </button>                        
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="flex-grow w-full">
        <div class="container mx-auto bg-white p-8 rounded-lg shadow-md mt-20 max-w-5xl text-center">
            <h2 class="text-4xl font-bold font-[Poppins] text-[#674636] mb-6">Library Books</h2>
            <div class="flex justify-between items-center mb-4">
                <input type="text" id="searchBar" placeholder="Search for a book..." class="border-2 border-[#674636] p-3 w-full rounded-lg shadow-sm focus:ring-2 focus:ring-blue-400 focus:border-[#674636] transition" onkeyup="searchBooks()">
                <button onclick="toggleView()" class="ml-4 bg-[#674636] text-white p-3 rounded-lg shadow-md hover:bg-[#FFF8E8] hover:text-[#674636] border border-transparent hover:border-[#674636]">
                    <i id="viewIcon" class="fas fa-list text-2xl"></i>
                </button>
            </div>
            <div id="booksContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mt-6"></div>
            <table id="listViewTable" class="hidden w-full border-collapse border border-gray-300 mt-6">
                <thead>
                    <tr class="bg-[#AAB396] text-white">
                        <th class="border border-gray-300 px-4 py-2">Title</th>
                        <th class="border border-gray-300 px-4 py-2">Author</th>
                        <th class="border border-gray-300 px-4 py-2">ISBN</th>
                        <th class="border border-gray-300 px-4 py-2">Availability</th>
                        <th class="border border-gray-300 px-4 py-2">Actions</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div id="bookModal" class="fixed inset-0 hidden bg-gray-900 bg-opacity-50 flex justify-center items-center font-[Poppins]">
        <div class="bg-white p-8 rounded-lg shadow-lg max-w-lg w-full">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-3xl font-bold text-center flex-1">Book Details</h3>
                <button onclick="closeModal()" class="text-gray-500 hover:text-gray-800 text-3xl font-bold">&times;</button>
            </div>
            <img id="modalBookImage" class="w-full h-40 object-cover mb-4 rounded">
            <h3 class="text-2xl font-bold" id="modalBookTitle"></h3>
            <p class="text-lg font-semibold text-gray-700" id="modalBookAuthor"></p>
            <p><strong>ISBN:</strong> <span id="modalBookISBN"></span></p>
            <p class="text-gray-700 mt-2"><strong>Description:</strong> <span id="modalBookDescription"></span></p>
            <p><strong>Availability:</strong> <span id="modalBookAvailability"></span></p>
        </div>
    </div>

    <footer class="bg-[#AAB396] text-white text-center py-4 mt-auto font-[Poppins]">
        <p class="text-lg">&copy; 2025 BookTrack. All Rights Reserved.</p>
    </footer>

    <script src="book.js"></script>
</body>
</html>
