<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Library Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/js/all.min.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Paytone+One&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Quicksand:wght@300..700&family=Sigmar&display=swap" rel="stylesheet">
</head>
<body class="bg-[#FFF8E8] flex flex-col min-h-screen font-[Poppins]">
    <nav class="bg-[#AAB396] text-white py-4 shadow-lg fixed top-0 w-full z-50">
        <div class="container mx-auto flex justify-between items-center px-6">
            <div class="flex items-center">
                <img src="img/booktrack.png" alt="Logo" class="h-10 w-auto"> 
                <span class="text-2xl font-[Sigmar] text-[#674636] ml-0">BookTrack</span>
            </div>
            <ul class="flex space-x-6 items-center">
                <li>
                    <a href="home.html" class="font-[Poppins] text-xl hover:text-[#674636]">Home</a>
                </li>
                <li>
                    <a href="book.html" class="font-[Poppins] text-xl hover:text-[#674636]">Books</a>
                </li>
                <li>
                    <a href="manage.html" class="font-[Poppins] text-xl hover:text-[#674636]">Manage</a>
                </li>
                <li>
                    <a href="contact.html" class="font-[Poppins] text-xl text-[#FFFFFF] border-b-2 border-[#FFFFFF]">Contact</a>
                </li>
                <li>
                    <a href="index.html">
                        <button onclick="logout()" class=" text-2xl hover:text-[#A31D1D] transition">
                            <i class="fas fa-sign-out-alt"></i>
                        </button>                        
                    </a>
                    
                </li>
            </ul>
        </div>
    </nav>
    <div class="container mx-auto mt-20 p-6 bg-white shadow-md rounded-lg max-w-lg text-center">
        <h2 class="text-2xl font-bold text-[#674636]">Contact Us</h2>
        <p class=" text-sm mt-1 text-[#674636]">Have a question? Reach out to us!</p>

        <form class="mt-4">
            <div class="mb-3 text-left">
                <label class="block text-[#674636] font-medium text-sm mb-1">Full Name</label>
                <input type="text" class="w-full p-2 border rounded text-sm" placeholder="Enter your name" required>
            </div>

            <div class="mb-3 text-left">
                <label class="block text-[#674636] font-medium text-sm mb-1">Email</label>
                <input type="email" class="w-full p-2 border rounded text-sm" placeholder="Enter your email" required>
            </div>

            <div class="mb-3 text-left">
                <label class="text-[#674636] font-medium text-sm mb-1">Message</label>
                <textarea class="w-full p-2 border rounded text-sm h-24" placeholder="Type your message..." required></textarea>
            </div>

            <button type="submit" 
                class="w-full bg-[#674636] text-[#FFF8E8] py-2 rounded transition hover:bg-[#FFF8E8] hover:text-[#674636] hover:border hover:border-[#674636]">
                Send Message
            </button>
        </form>

        <div class="mt-4">
            <h3 class="text-lg font-bold text-[#674636]">Connect with us</h3>
            <div class="flex justify-center space-x-4 mt-3">
                <a href="https://twitter.com" target="_blank" class="text-[#AAB396] text-xl hover:text-blue-700 transition">
                    <i class="fab fa-twitter"></i>
                </a>
                <a href="mailto:yourlibrary@gmail.com" class="text-[#AAB396] text-xl hover:text-red-800 transition">
                    <i class="fas fa-envelope"></i>
                </a>
                <a href="https://m.me/yourlibrary" target="_blank" class="text-[#AAB396] text-xl hover:text-blue-900 transition">
                    <i class="fab fa-facebook-messenger"></i>
                </a>
                <a href="https://linkedin.com/in/yourlibrary" target="_blank" class="text-[#AAB396] text-xl hover:text-blue-900 transition">
                    <i class="fab fa-linkedin"></i>
                </a>
            </div>
        </div>
    </div>

    <footer class="bg-[#AAB396] text-white text-center py-4 mt-auto font-[poppins]">
        <p class="text-lg">&copy; 2025 BookTrack. All Rights Reserved.</p>
    </footer>

    <script src="logout.js"></script>

</body>
</html>
