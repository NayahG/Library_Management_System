<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> <!-- SweetAlert -->
</head>
<body class="bg-gray-100 flex justify-center items-center h-screen">

    <div class="bg-white p-8 rounded-lg shadow-md w-96">
        <h2 class="text-2xl font-bold text-center mb-4">Admin Login</h2>
        <form id="loginForm">
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold mb-2">Username</label>
                <input type="text" id="username" class="w-full p-2 border rounded" placeholder="Enter username">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold mb-2">Password</label>
                <input type="password" id="password" class="w-full p-2 border rounded" placeholder="Enter password">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Login</button>
            <p id="errorMessage" class="text-red-500 text-center mt-2 hidden">Invalid username or password.</p>
        </form>
        <div class="mt-4 text-center">
            <a href="index.html" class="text-blue-600 hover:underline">← Back to Home</a>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
