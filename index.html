<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Paytone+One&family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
            url('img/bghome.jpg');          
            background-size: cover;  
            background-position: center; 
            background-repeat: no-repeat;
        }
    </style>
</head>
<body class="flex flex-col md:flex-row justify-center items-center min-h-screen bg-black bg-opacity-60 px-4 md:px-6 gap-12">

    <div class="text-white text-center md:text-left md:w-1/2 px-4 md:px-8 mb-6 md:mb-0 -ml-4">
        <h1 class="text-3xl sm:text-4xl md:text-5xl font-bold font-[Poppins] drop-shadow-xl text-center">
            Welcome to BookTrack
        </h1>
        <p class="mt-3 text-sm sm:text-base md:text-lg font-[Poppins] max-w-l mx-auto drop-shadow-lg text-center">
            BookTrack streamlines book organization and tracking.
            Please sign in to take control of your library with ease.
        </p>
    </div>

    <div class="w-full max-w-sm sm:max-w-md md:w-1/3 bg-white bg-opacity-80 p-6 sm:p-8 rounded-lg shadow-lg text-center">
        <h2 class="text-xl sm:text-2xl font-bold text-center mb-4 text-[#674636] font-[Poppins]">Admin Login</h2>
        <form id="loginForm">
            <div class="mb-4">
                <label class="block text-[#674636] font-semibold mb-2 text-left font-[Poppins]">Username</label>
                <input type="text" id="username" class="w-full p-3 border border-[#b89c8a] rounded bg-[#f7f3f0] text-[#4d3225] focus:ring-2 focus:ring-[#674636]" placeholder="Enter username">
            </div>
            <div class="mb-4">
                <label class="block text-[#674636] font-semibold mb-2 text-left font-[Poppins]">Password</label>
                <input type="password" id="password" class="w-full p-3 border border-[#b89c8a] rounded bg-[#f7f3f0] text-[#4d3225] focus:ring-2 focus:ring-[#674636]" placeholder="Enter password">
            </div>
            <button type="submit" class="w-full bg-[#674636] text-white py-3 rounded-lg transition duration-300 hover:bg-[#4d3225] hover:text-white border-2 border-[#674636] font-semibold">
                Login
            </button>
            <p id="errorMessage" class="text-red-500 text-center mt-3 hidden font-[Poppins]">Invalid username or password.</p>
        </form>
    </div>

    <script src="index.js"></script>
</body>
</html>
