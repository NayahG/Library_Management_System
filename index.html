<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Paytone+One&family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
            url('img/bghome.jpg');          
            background-size: cover;  
            background-position: center; 
            background-repeat: no-repeat;
        }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen bg-black bg-opacity-60 px-6 md:px-4">

    <div class="mb-8 text-white">
        <h1 class="text-4xl sm:text-5xl font-bold font-[Poppins] drop-shadow-xl">
            Welcome to BookTrack
        </h1>
        <p class="mt-4 text-base sm:text-lg font-[Poppins] max-w-xl mx-auto drop-shadow-lg">
            BookTrack streamlines book organization and tracking.
            Please sign in to take control of your library with ease.
        </p>
    </div>

    <div class="text-white p-6 sm:p-10 rounded-lg shadow-2xl max-w-lg w-full text-center">

        <div class="bg-white bg-opacity-70 p-6 sm:p-8 rounded-lg shadow-lg w-full max-w-md mx-auto">
            <h2 class="text-xl sm:text-2xl font-bold text-center mb-6 text-[#674636] font-[Poppins]">Admin Login</h2>
            <form id="loginForm">
                <div class="mb-4">
                    <label class="block text-[#674636] font-semibold mb-2 text-left font-[Poppins]">Username</label>
                    <input type="text" id="username" class="w-full p-3 border border-[#b89c8a] rounded bg-[#f7f3f0] text-[#4d3225] focus:ring-2 focus:ring-[#674636]" placeholder="Enter username">
                </div>
                <div class="mb-4">
                    <label class="block text-[#674636] font-semibold mb-2 text-left font-[Poppins]">Password</label>
                    <input type="password" id="password" class="w-full p-3 border border-[#b89c8a] rounded bg-[#f7f3f0] text-[#4d3225] focus:ring-2 focus:ring-[#674636]" placeholder="Enter password">
                </div>
                <button type="submit" class="w-full bg-[#674636] text-white py-2 rounded-lg transition duration-300 hover:bg-[#4d3225] hover:text-white border-2 border-[#674636] font-semibold">
                    Login
                </button>
                <p id="errorMessage" class="text-red-500 text-center mt-3 hidden font-[Poppins]">Invalid username or password.</p>
            </form>
        </div>
        
    </div>

    <script src="index.js"></script>
</body>
</html>
