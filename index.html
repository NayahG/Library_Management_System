<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> <!-- SweetAlert -->
    <style>
        body {
            background: url('img/bghome.jpg') no-repeat center center fixed;
            background-size: cover;
        }
    </style>
</head>
<body class="flex justify-center items-center h-screen bg-black bg-opacity-60 px-4">

    <!-- Main Container -->
    <div class="bg-[#F4EDE4] p-10 rounded-lg shadow-2xl max-w-2xl w-full text-center">
        
        <!-- Welcome Section -->
        <div class="mb-10">
            <h1 class="text-5xl font-bold text-[#674636] font-[Poppins] drop-shadow-xl">
                Welcome to BookTrack
            </h1>
            <p class="mt-4 text-lg text-gray-800 font-[Poppins] max-w-xl mx-auto drop-shadow-lg">
                BookTrack streamlines book organization and tracking.<br>
                Please sign in to take control of your library with ease.
            </p>
        </div>

        <!-- Login Form -->
        <div class="bg-[#f3e8e1] p-8 rounded-lg shadow-lg w-96 mx-auto border-2 border-[#d6bfb1]">
            <h2 class="text-2xl font-bold text-center mb-6 text-[#4d3225]">Admin Login</h2>
            <form id="loginForm">
                <div class="mb-4">
                    <label class="block text-[#4d3225] font-semibold mb-2 text-left">Username</label>
                    <input type="text" id="username" class="w-full p-3 border border-[#b89c8a] rounded bg-[#f7f3f0] text-[#4d3225] focus:ring-2 focus:ring-[#674636]" placeholder="Enter username">
                </div>
                <div class="mb-4">
                    <label class="block text-[#4d3225] font-semibold mb-2 text-left">Password</label>
                    <input type="password" id="password" class="w-full p-3 border border-[#b89c8a] rounded bg-[#f7f3f0] text-[#4d3225] focus:ring-2 focus:ring-[#674636]" placeholder="Enter password">
                </div>
                <button type="submit" class="w-full bg-[#674636] text-white py-2 rounded-lg transition duration-300 hover:bg-[#4d3225] hover:text-white border-2 border-[#674636] font-semibold">
                    Login
                </button>
                <p id="errorMessage" class="text-red-500 text-center mt-3 hidden">Invalid username or password.</p>
            </form>
        </div>
        
        
    </div>

    <script src="index.js"></script>
</body>
</html>
